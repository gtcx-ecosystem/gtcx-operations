# Email provider configuration
# EMAIL IS FALLBACK ONLY — WhatsApp and Platform are primary channels
# This config exists for legal requirements and investor preferences only

provider: mock
from_address: ops@gtcx.io
from_name: GTCX Operations
reply_to: founders@gtcx.io
rate_limit_per_second: 10

# Usage rules:
# 1. Legal notices requiring written communication
# 2. Investor explicitly prefers email (set in CRM preferred_channel)
# 3. External auditors requesting email records
# 4. Board resolutions if bylaws mandate email

# For all other communications, use WhatsApp or Platform

# Gmail API settings (if needed for legal emails)
gmail:
  credentials_path: .secrets/gmail-credentials.json
  token_path: .secrets/gmail-token.json
  user_id: me
  scopes:
    - https://www.googleapis.com/auth/gmail.send
    - https://www.googleapis.com/auth/gmail.readonly

# Google Workspace integration (for legal document storage only)
google_workspace:
  enabled: true
  credentials_path: .secrets/workspace-credentials.json
  token_path: .secrets/workspace-token.json
  services:
    calendar:
      enabled: true
      calendar_id: primary
    drive:
      enabled: true
    sheets:
      enabled: true

# Fallback: mock for testing
mock:
  enabled: true
