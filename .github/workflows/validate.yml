name: Validate Operations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1-5'  # Weekdays at 06:00 UTC

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run validate
      - run: npm run lint:policies
      - run: npm run check:budgets

      - name: Commit automated fixes
        if: github.event_name == 'schedule'
        run: |
          git config user.name "gtcx-agent"
          git config user.email "agent@gtcx.io"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ops): automated validation fixes $(date +%F)"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GTCX_AGENT_TOKEN }}
