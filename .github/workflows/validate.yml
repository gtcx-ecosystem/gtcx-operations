name: Validate Operations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1-5'  # Weekdays at 06:00 UTC

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Validate all contracts and data
        run: pnpm validate

      - name: Lint policies
        run: pnpm lint:policies

      - name: Check budgets
        run: pnpm check:budgets

      - name: Check IP deadlines
        run: pnpm ip:check

      - name: Generate CRM report
        run: pnpm crm:report

      - name: Sync budget summaries
        run: pnpm sync:budgets

      - name: Commit automated updates
        if: github.event_name == 'schedule'
        run: |
          git config user.name "gtcx-agent"
          git config user.email "agent@gtcx.io"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ops): automated validation and sync $(date +%F)"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GTCX_AGENT_TOKEN }}
